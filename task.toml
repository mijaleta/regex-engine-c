schema_version = "1.3"

[task]
name = "mijaleta/regex-engine-c"
description = "Implement a regular-expression engine in C with only the standard library, following Python's re module in ASCII mode exactly: its pattern syntax and errors, backtracking semantics with groups, lazy, possessive and atomic repeats, lookaround, backreferences and conditionals, plus search, finditer, sub and split. Scored on a hidden suite whose expected outputs come from Python 3.13."
keywords = ["c", "regex", "backtracking", "parsing", "python-re"]

[metadata]
difficulty = "hard"
category = "software"

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
# C build (seconds) plus 370 cases capped at 10 s each.
timeout_sec = 3600.0

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[environment.env]

[verifier.env]

